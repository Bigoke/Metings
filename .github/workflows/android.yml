name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/models.yml", "README.md"]
  workflow_dispatch:

permissions:
  contents: write

env:
  WHISPER_CPP_TAG: v1.9.6
  SHERPA_ONNX_VERSION: 1.13.7

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Fetch whisper.cpp (speech engine)
        run: git clone --depth 1 --branch "$WHISPER_CPP_TAG" https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - name: Fetch sherpa-onnx (speaker detection)
        run: |
          mkdir -p app/libs
          curl -fL -o app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_ONNX_VERSION}/sherpa-onnx-${SHERPA_ONNX_VERSION}.aar"
          unzip -l app/libs/sherpa-onnx.aar | grep -E "arm64|classes.jar"

      # A stable signing key lets new versions install over old ones (keeping your downloaded models).
      # Uses repo secrets KEYSTORE_B64 + KEYSTORE_PASSWORD when present, otherwise a cached key.
      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: signing/metings.keystore
          key: metings-signing-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p signing
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > signing/release.keystore
            echo "KEYSTORE_FILE=$PWD/signing/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=metings" >> "$GITHUB_ENV"
          else
            if [ ! -f signing/metings.keystore ]; then
              keytool -genkeypair -keystore signing/metings.keystore -storetype PKCS12 -alias metings \
                -keyalg RSA -keysize 2048 -validity 10000 -storepass metings-local -keypass metings-local \
                -dname "CN=Metings, O=Bigoke, C=ZA"
            fi
            echo "KEYSTORE_FILE=$PWD/signing/metings.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=metings-local" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=metings-local" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=metings" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Metings-${VERSION}.apk"
          ls -lh out
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Metings-${{ steps.apk.outputs.version }}
          path: out/*.apk

      - name: Publish to Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.apk.outputs.version }}"
          gh release create "$TAG" out/*.apk --repo "$GITHUB_REPOSITORY" --title "Metings ${{ steps.apk.outputs.version }}" \
            --notes "Install the APK on your phone. On first launch, open Models and tap Download all (one-time, about 3.5 GB). After that the app works fully offline." --latest
