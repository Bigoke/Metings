name: Design screenshots

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/src/main/java/com/bigoke/metings/ui/**", "app/src/test/java/com/bigoke/metings/screens/**", ".github/workflows/screens.yml"]

permissions:
  contents: write

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.14.3" }
      - name: Fetch native deps
        run: |
          git clone --depth 1 --branch v1.9.6 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp
          mkdir -p app/libs && curl -fL -o app/libs/sherpa-onnx.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.7/sherpa-onnx-1.13.7.aar
      - name: Render screens
        run: gradle :app:testDebugUnitTest --tests "com.bigoke.metings.screens.*" --no-daemon -x externalNativeBuildDebug || gradle :app:testDebugUnitTest --tests "com.bigoke.metings.screens.*" --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: |
            app/build/screens/*.png
            app/build/reports/tests/
      - name: Publish screenshots to the design-screens branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp app/build/screens/*.png /tmp/shots/ || exit 0
          cd /tmp/shots
          git init -q -b design-screens
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "Design screenshots ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" design-screens
